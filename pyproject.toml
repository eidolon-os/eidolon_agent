[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-agent"
version = "0.1.0"
description = "Eidolon Agent — desktop companion control plane; gRPC LLM-replacement for LiveKit voice pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "eidolon" }]
keywords = ["agent", "llm", "companion", "memory", "grpc", "livekit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# Runtime dependencies. Group ordering follows architecture layers
# (transport → infra → llm/memory → utils) so a quick read tells the story.
dependencies = [
    # Transport
    "grpcio>=1.62.0",
    "grpcio-status>=1.62.0",
    "protobuf>=4.25.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "PyJWT[crypto]>=2.8.0",

    # Infra: NATS (event bus + KV + JetStream), SQLite, config
    "nats-py>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.27",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0.1",
    "watchdog>=4.0.0",

    # LLM / Memory / MCP
    "httpx>=0.27.0",
    "litellm>=1.40.0",
    "mcp>=1.0.0",

    # Observability
    "loguru>=0.7.2",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-grpc>=0.45b0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",

    # Utilities
    "anyio>=4.3.0",
    "qrcode[pil]>=7.4.2",
    "ruff>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "grpcio-tools>=1.62.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
eidolon-agent = "eidolon_agent.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eidolon_agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["eidolon_agent/transport/grpc/proto/*_pb2*"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "ERA",     # eradicate (commented-out code is forbidden per project policy)
    "RUF",
]
ignore = [
    "E501",    # line length handled by formatter
    # The project is bilingual zh-CN / en. RUF001-003 flag full-width Chinese
    # punctuation as "ambiguous" against ASCII look-alikes; these are deliberate.
    "RUF001",
    "RUF002",
    "RUF003",
    # try/except/pass in cancel/cleanup paths is intentional best-effort.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google.*",
]
