[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-agent"
version = "0.1.0"
description = "Eidolon Agent — desktop companion control plane; gRPC LLM-replacement for LiveKit voice pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "eidolon" }]
keywords = ["agent", "llm", "companion", "memory", "grpc", "livekit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# Runtime dependencies. Group ordering follows architecture layers
# (transport → infra → llm/memory → utils) so a quick read tells the story.
dependencies = [
    # Transport
    "grpcio>=1.62.0",
    "grpcio-status>=1.62.0",
    "protobuf>=4.25.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
    "eidolon-sdk[runtime]",

    # Infra: NATS (event bus + KV + JetStream), SQLite, config
    "nats-py>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.27",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0.1",
    "watchdog>=4.0.0",

    # LLM / Memory / MCP
    "httpx>=0.27.0",
    "litellm>=1.40.0",
    "mcp>=1.0.0",

    # Observability
    "loguru>=0.7.2",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-grpc>=0.45b0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",

    # Utilities
    "anyio>=4.3.0",
    "qrcode[pil]>=7.4.2",
    "ruff>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "grpcio-tools>=1.62.0",
    "types-PyYAML>=6.0.12",
    "import-linter>=2.0",
]

[project.scripts]
eidolon-agent = "eidolon_agent.app.runtime.cli:main"

[tool.uv.sources]
eidolon-sdk = { path = "../eidolon_sdk", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["eidolon_agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["eidolon_agent/app/transport/grpc/proto/*_pb2*"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "ERA",     # eradicate (commented-out code is forbidden per project policy)
    "RUF",
]
ignore = [
    "E501",    # line length handled by formatter
    # The project is bilingual zh-CN / en. RUF001-003 flag full-width Chinese
    # punctuation as "ambiguous" against ASCII look-alikes; these are deliberate.
    "RUF001",
    "RUF002",
    "RUF003",
    # try/except/pass in cancel/cleanup paths is intentional best-effort.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Discover tests both at the project root (cross-cutting / integration / arch)
# and co-located with each module under eidolon_agent/<layer>/<module>/tests/.
testpaths = ["tests", "eidolon_agent"]
python_files = ["test_*.py"]
markers = [
    "unit: pure unit test — mocks all external collaborators",
    "functional: module-level test — in-memory adapters allowed (FakeLLM, InMemoryEventBus, in-mem SQLite)",
    "integration: cross-module / cross-layer test (still in-process, no real network/NATS/LLM)",
    "smoke: requires real external service (NATS, LLM endpoint); skipped in default CI",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google.*",
]

[tool.coverage.run]
source = ["eidolon_agent"]
omit = [
    "*/tests/*",
    "*/_pb2*",
    "eidolon_agent/app/transport/grpc/proto/*",
    "eidolon_agent/infra/persistence/migrations/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_empty = true
precision = 1
# CI gate: ratchet upward as gaps close. Currently 77% project-wide
# (~80% for infra/). Remaining gap is NATS / MCP paths that need a real
# broker — those stay in smoke tests, not unit coverage.
fail_under = 77

# ---------------------------------------------------------------------------
# import-linter: enforces the layered architecture.
# Run: `.venv/bin/lint-imports`.
# Contracts grow phase by phase (see plans/1-eidolon-agent...md).
# ---------------------------------------------------------------------------

[tool.importlinter]
root_package = "eidolon_agent"

# Module-local test packages live under <layer>/<module>/tests/ — each
# contract excludes them via ignore_imports below so a test for
# infra.persistence may import any domain type it needs to construct
# fixtures without breaking the layer rule.

# L0 — core/: pure types & protocols. Zero sibling deps.
[[tool.importlinter.contracts]]
name = "core has zero sibling-module dependencies"
type = "forbidden"
source_modules = ["eidolon_agent.core"]
forbidden_modules = [
    "eidolon_agent.app",
    "eidolon_agent.domain",
    "eidolon_agent.infra",
]
ignore_imports = ["**.tests.** -> **"]

# L1 — domain/: business logic. May import core/ only.
[[tool.importlinter.contracts]]
name = "domain modules do not import infra or app"
type = "forbidden"
source_modules = ["eidolon_agent.domain"]
forbidden_modules = [
    "eidolon_agent.infra",
    "eidolon_agent.app",
]
ignore_imports = ["**.tests.** -> **"]

# L2 — infra/: adapters. Must not depend on app/. May reference domain TYPES
# when implementing a domain-owned port (see Phase 1 of the refactor plan).
[[tool.importlinter.contracts]]
name = "infra modules do not import app"
type = "forbidden"
source_modules = ["eidolon_agent.infra"]
forbidden_modules = ["eidolon_agent.app"]
ignore_imports = ["**.tests.** -> **"]

# Allow infra → domain TYPE imports only. Anything beyond types (services,
# registries, etc.) would invert the layer and is forbidden.
[[tool.importlinter.contracts]]
name = "infra imports of domain are limited to type modules"
type = "forbidden"
source_modules = ["eidolon_agent.infra"]
forbidden_modules = ["eidolon_agent.domain"]
ignore_imports = [
    "eidolon_agent.infra.persistence.repositories -> eidolon_agent.domain.personas.types",
    "eidolon_agent.infra.persistence.sql_persona_instance_store -> eidolon_agent.domain.personas.types",
    "eidolon_agent.infra.persistence.sql_evolution_history_store -> eidolon_agent.domain.personas.types",
    "**.tests.** -> **",
]
