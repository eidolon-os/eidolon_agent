# eidolon-agent configuration template.
#
#   cp config/settings.example.yaml config/settings.yaml
#   cp config/.env.example config/.env
#
# Secrets (LLM API key, pairing JWT) go in config/.env only.

env: dev

grpc:
  tcp_host: 127.0.0.1
  tcp_port: 45051
  uds_path: ~/eidolon/run/eidolon-agent.sock

http:
  host: 127.0.0.1
  port: 8180
  admin_port: 8081

nats:
  url: nats://127.0.0.1:4222

memory:
  discovery_url: http://127.0.0.1:8020/api/discovery/agent-routing
  discovery_token_env: ""   # env var name for discovery bearer (optional)
  discovery_refresh_s: 30
  endpoints:
    - user_id: default
      mcp_url: http://127.0.0.1:8030/mcp
  recall_timeout_s: 0.3

sqlite:
  path: ~/eidolon/history/eidolon_agent.sqlite3
  enable_wal: true

llm:
  api_key: EIDOLON_AGENT_LLM_API_KEY
  models:
    - name: openai/deepseek-v4-flash
      api_base: http://127.0.0.1:8180/v1
    # Configure a second model to make `fallback_models` effective. It should
    # be a genuinely independent endpoint — falling back to the same upstream
    # that just failed buys nothing.
    # - name: openai/deepseek-v4-backup
    #   api_base: http://backup-gateway.internal/v1
  default_model: openai/deepseek-v4-flash
  # Ordered list of model names to try (in order) when the default fails
  # *before its first token*. Empty by default → no failover. The router only
  # fails over on errors, not on a slow-but-successful response.
  fallback_models: []
  # litellm/httpx tuning. trust_env=False makes the LLM HTTP client IGNORE the
  # ambient HTTP(S)_PROXY / NO_PROXY / .netrc env. We default to False because
  # the LLM endpoint here is reached directly; an env proxy intercepting the
  # call returns 502 (root cause of the original cold-start failures).
  # IMPORTANT: this assumes `api_base` is reachable WITHOUT a proxy. If a future
  # endpoint is only reachable via a corporate proxy, set trust_env: true and
  # ensure NO_PROXY covers any loopback endpoints.
  trust_env: false
  shared_http_client: true   # one pooled, keepalive httpx client across turns
  max_retries: 2
  startup_warm_enabled: true # prime DNS/TCP/TLS + upstream model at boot
  startup_warm_timeout_s: 10.0

workstation:
  transport: nats

persona:
  templates_dir: eidolon_agent/domain/personas/templates
  instances_dir: ~/eidolon/personas/instances
  storage: sqlite
  auto_evolution_enabled: true

observability:
  log_level: INFO
  log_json: true
  log_dir: ~/eidolon/logs

pairing:
  jwt_secret: PAIRING_JWT_SECRET
  jwt_algorithm: HS256

runtime:
  log_dir: ~/eidolon/logs
  run_dir: ~/eidolon/run
  debug_dir: ~/eidolon/debug
