env: dev
grpc:
  tcp_host: 127.0.0.1
  tcp_port: 45051
  uds_path: $EIDOLON_RUNTIME_ROOT/agent/eidolon-agent.sock
http:
  host: 127.0.0.1
  port: 8180
  admin_port: 8081
  cors_origins:
  - http://127.0.0.1:5281
nats:
  url: nats://127.0.0.1:4222
memory:
  discovery_url: http://127.0.0.1:8020/api/discovery/agent-routing
  discovery_token_env: ''
  discovery_refresh_s: 30
  endpoints:
  - memory_space_id: default.default.default
    mcp_url: http://127.0.0.1:8030/mcp
  recall_timeout_s: 0.5
  explicit_recall_timeout_s: 4.0
llm:
  api_key: EIDOLON_AGENT_LLM_API_KEY
  models:
  - name: openai/deepseek-v4-flash
    api_base: https://api.deepseek.com/v1
  default_model: openai/deepseek-v4-flash
long_task:
  transport: mementos_http
  mementos_base_url: http://127.0.0.1:18765
body_control:
  # Blocked until Channel publishes a stable Provider directory/command contract.
  enabled: false
observability:
  log_level: DEBUG
  log_json: true
  log_dir: $EIDOLON_LOG_ROOT/agent
system_data:
  base_url: http://127.0.0.1:8084
  service_token_env: EIDOLON_DATA_COMPANION_AUTHORITY_TOKEN
  timeout_s: 5.0
  connect_timeout_s: 2.0
runtime_token:
  jwt_secret: PAIRING_JWT_SECRET
  jwt_algorithm: HS256
runtime:
  log_dir: $EIDOLON_LOG_ROOT/agent
  run_dir: $EIDOLON_RUNTIME_ROOT/agent
  debug_dir: $EIDOLON_CACHE_ROOT/debug/agent
persistence:
  sqlite_path: $EIDOLON_STATE_ROOT/agent/eidolon-agent.sqlite3
  busy_timeout_ms: 5000
  wal_autocheckpoint_pages: 1000
turn:
  slow_tool_hint_delay_ms: 1500
