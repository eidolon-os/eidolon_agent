env: dev
grpc:
  tcp_host: 127.0.0.1
  tcp_port: 45051
  uds_path: ~/eidolon/run/eidolon-agent.sock
http:
  host: 127.0.0.1
  port: 8180
  admin_port: 8081
  cors_origins:
  - http://127.0.0.1:5281
nats:
  url: nats://127.0.0.1:4222
memory:
  discovery_url: http://127.0.0.1:8020/api/discovery/agent-routing
  discovery_token_env: ''
  discovery_refresh_s: 30
  endpoints:
  - memory_space_id: default.default.default
    mcp_url: http://127.0.0.1:8030/mcp
  recall_timeout_s: 0.3
llm:
  api_key: EIDOLON_AGENT_LLM_API_KEY
  models:
  - name: openai/deepseek-v4-flash
    api_base: https://api.deepseek.com/v1
  default_model: openai/deepseek-v4-flash
long_task:
  transport: mementos_http
  mementos_base_url: http://127.0.0.1:18765
body_control:
  enabled: true
  hub_base_url: http://127.0.0.1:8082
  timeout_s: 5.0
persona:
  templates_dir: eidolon_agent/domain/personas/templates
  instances_dir: ~/eidolon/personas/instances
  auto_evolution_enabled: true
observability:
  log_level: DEBUG
  log_json: true
  log_dir: ~/eidolon/logs
pairing:
  jwt_secret: PAIRING_JWT_SECRET
  jwt_algorithm: HS256
runtime:
  log_dir: ~/eidolon/logs
  run_dir: ~/eidolon/run
  debug_dir: ~/eidolon/debug
turn:
  slow_tool_hint_delay_ms: 1500
